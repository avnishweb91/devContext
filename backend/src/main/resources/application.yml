spring:
  application:
    name: devcontext-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:devcontext;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
server:
  port: 8080
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
devcontext:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
