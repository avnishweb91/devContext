spring:
  application:
    name: devcontext-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:devcontext;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
devcontext:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    endpoint: ${AI_API_ENDPOINT:https://api.openai.com/v1/chat/completions}
  integrations:
    github:
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
      reaper:
        timeout-minutes: ${GITHUB_SYNC_TIMEOUT_MINUTES:30}
        delay-ms: ${GITHUB_SYNC_REAPER_DELAY_MS:300000}
  security:
    enabled: ${SECURITY_ENABLED:false}
