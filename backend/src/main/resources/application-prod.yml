spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email,repo
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:devcontext}}
    username: ${DATABASE_USERNAME:${PGUSER:devcontext}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

devcontext:
  security:
    enabled: ${SECURITY_ENABLED:true}
